[project]
name = "gitx"
version = "1.0.6"
description = "给中国人用的 GitHub 加速下载与同步工具"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
{ name = "FLT18355", email = "cm18750724707a@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "prompt-toolkit>=3.0.43",
    "questionary>=2.1.1",
    "typer>=0.27.3",
]
[project.scripts]
gitx = "gitx:main"

[tool.ruff]
# 行宽按作者既有风格 (最长一行 123 列, 中文注释不希望被硬折行)
line-length = 130
target-version = "py314"
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "C4", "SIM", "PIE", "RET", "RUF", "ARG", "A001", "BLE001"]
ignore = [
    "RUF001",   # 中文文档与提示故意用全角标点 (：。), 不是笔误
    "RUF002",
    "RUF003",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
